name: CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure hook script is executable
        run: chmod +x .claude/hooks/rust-skill-eval-hook.sh

      - name: Run repository validation
        run: python3 scripts/validate_repo.py

      - name: Run hook matcher tests
        run: python3 tests/hook-matcher-test.py

      - name: Run trigger self-check
        run: bash test-triggers.sh --self-check

      - name: Run validation script
        run: bash tests/validation/validate-skills.sh

      - name: Run quality checks
        run: bash scripts/quality-check.sh
